# Stage 1/5: Authentication & deployment refinement
services:
  - type: web
    name: ai-powered-task-manager
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_dev_data && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT"
