# Stage 2/5: Implementation refinement
services:
  - type: web
    name: ai-powered-task-manager
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_dev_data && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
