{% extends 'base.html' %}

{% block title %}End-of-Day Review — My Habbit Tracker{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                    <i data-lucide="moon" class="w-5 h-5"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">End-of-Day Review</h1>
            </div>
            <p class="text-sm text-slate-500 mt-1">{{ today_date }} • Close open loops and plan tomorrow with confidence</p>
        </div>
        <a href="{% url 'dashboard' %}" class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1.5"></i>
