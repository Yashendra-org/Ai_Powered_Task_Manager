{% extends 'base.html' %}

{% block title %}Smart Assistant — My Habbit Tracker{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">AI Smart Assistant</h1>
            </div>
            <p class="text-sm text-slate-500 mt-1">Data-driven routine suggestions, time window recommendations, and completion likelihood</p>
        </div>
        <a href="{% url 'end_of_day_review' %}" class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors">
            <i data-lucide="moon" class="w-3.5 h-3.5 mr-1.5"></i>
