{% extends 'base.html' %}

{% block title %}{{ title }} — My Habbit Tracker{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ title }}</h1>
            <p class="text-sm text-slate-500 mt-1">Configure frequency, scheduled days, and target times</p>
        </div>
        <a href="{% url 'habit_list' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
            Cancel
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Habit Title *</label>
                {{ form.title }}
                {% if form.title.errors %}
                <p class="mt-1 text-xs text-red-600">{{ form.title.errors.0 }}</p>
                {% endif %}
            </div>
