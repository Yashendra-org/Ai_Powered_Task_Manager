<!-- Stage 3/5: Implementation refinement -->
{% extends 'base.html' %}

{% block title %}Check Your Email — My Habit Tracker{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl shadow-slate-100 text-center">
        <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto border border-emerald-100 shadow-sm">
            <i data-lucide="mail-check" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Reset Link Sent!</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
            If an account exists with that email address, we have dispatched a password reset link. Please check your inbox (and spam folder) within the next few minutes.
        </p>
