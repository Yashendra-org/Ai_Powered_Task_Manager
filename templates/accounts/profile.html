<!-- Stage 1/5: Implementation refinement -->
{% extends 'base.html' %}

{% block title %}User Profile — {{ user.username }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6 pb-12">
    <!-- Profile Header Card -->
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center sm:items-start justify-between gap-6">
        <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-5 text-center sm:text-left">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center font-bold text-3xl shadow-lg shadow-emerald-200 select-none">
                {{ user.username|slice:":1"|upper }}
            </div>
            <div>
                <div class="flex items-center justify-center sm:justify-start space-x-2">
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">{{ user.username }}</h1>
                    {% if user.is_superuser %}
                        <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md bg-purple-100 text-purple-700 border border-purple-200">Admin</span>
                    {% else %}
                        <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md bg-emerald-100 text-emerald-700 border border-emerald-200">Active</span>
                    {% endif %}
                </div>
                <p class="text-sm text-slate-500 mt-1 flex items-center justify-center sm:justify-start">
                    <i data-lucide="mail" class="w-4 h-4 mr-1.5 text-slate-400"></i>
                    {{ user.email|default:"No email configured" }}
                </p>
                <p class="text-xs text-slate-400 mt-1 flex items-center justify-center sm:justify-start">
                    <i data-lucide="globe" class="w-3.5 h-3.5 mr-1.5 text-slate-400"></i>
