{% extends 'base.html' %}

{% block title %}Reset Password — My Habit Tracker{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl shadow-slate-100">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-4 border border-emerald-100 shadow-sm">
                <i data-lucide="key-round" class="w-7 h-7"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Forgot Password?</h2>
            <p class="mt-2 text-xs text-slate-500 leading-relaxed">
                Enter your account email address below, and we'll send you a secure link to reset your password.
            </p>
        </div>

        <form class="mt-6 space-y-5" method="POST">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                    Account Email Address
                </label>
                <input type="email" name="email" id="id_email" required
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-slate-800 placeholder-slate-400 text-sm font-medium transition-all"
                       placeholder="student@college.edu">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-sm shadow-md shadow-emerald-200 hover:shadow-lg transition-all flex items-center justify-center">
                <i data-lucide="send" class="w-4 h-4 mr-2"></i>
                Send Password Reset Link
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="{% url 'login' %}" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 inline-flex items-center">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1"></i>
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
