{% extends 'base.html' %}

{% block title %}Reset Password — My Habit Tracker{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl shadow-slate-100">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-4 border border-emerald-100 shadow-sm">
                <i data-lucide="key-round" class="w-7 h-7"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Forgot Password?</h2>
            <p class="mt-2 text-xs text-slate-500 leading-relaxed">
                Enter your account email address below, and we'll send you a secure link to reset your password.
            </p>
        </div>

        <form class="mt-6 space-y-5" method="POST">
            {% csrf_token %}
