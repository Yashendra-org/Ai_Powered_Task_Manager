{% extends 'base.html' %}

{% block title %}My Day — My Habbit Tracker{% endblock %}

{% block content %}
<div class="space-y-6 max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i data-lucide="sun" class="w-5 h-5"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">My Day</h1>
            </div>
            <p class="text-sm text-slate-500 mt-1">{{ today_date }} • Focus on what matters right now</p>
        </div>

        <div class="flex items-center space-x-3">
            <span id="my-day-completion-rate" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 border border-blue-100">
                {{ completed_count }} of {{ total_count }} Done ({{ completion_rate }}%)
            </span>
