{% extends 'base.html' %}

{% block title %}New Category — My Habbit Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Create Category</h1>
        <p class="text-sm text-slate-500 mt-1">Organize your tasks with color-coded categories</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Category Name *</label>
                {{ form.name }}
                {% if form.name.errors %}
                <p class="mt-1 text-xs text-red-600">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Badge Color</label>
                {{ form.color }}
            </div>

            <div class="pt-6 border-t border-slate-100 flex items-center justify-end space-x-3">
                <a href="{% url 'all_tasks' %}" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                    Cancel
                </a>
