{% extends 'base.html' %}

{% block title %}Quick Notes — My Habbit Tracker{% endblock %}

{% block content %}
<div class="space-y-6 max-w-6xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                    <i data-lucide="sticky-note" class="w-5 h-5"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Quick Notes</h1>
            </div>
            <p class="text-sm text-slate-500 mt-1">Capture ideas, reference points, and study thoughts</p>
        </div>

        <div class="flex items-center space-x-3">
            <a href="{% url 'note_create' %}" class="inline-flex items-center px-4 py-2 text-xs font-semibold rounded-lg text-white bg-amber-600 hover:bg-amber-700 shadow-sm shadow-amber-200 transition-colors">
                <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i>
                New Note
            </a>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <form method="GET" class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" name="q" value="{{ search_query }}" placeholder="Search through all your notes..." class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white text-slate-800 placeholder-slate-400">
        </form>
    </div>

    <!-- Notes Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        {% if notes %}
            {% for note in notes %}
            <div class="bg-white rounded-2xl border {% if note.is_pinned %}border-amber-300 ring-2 ring-amber-100 shadow-sm{% else %}border-slate-200 hover:border-amber-200 hover:shadow-sm{% endif %} p-5 flex flex-col justify-between transition-all group">
                <div>
                    <div class="flex items-start justify-between gap-2">
                        <h3 class="text-sm font-bold text-slate-900 leading-snug">{{ note.title }}</h3>
                        
                        <!-- Pin Button -->
                        <form method="POST" action="{% url 'note_toggle_pin' note.id %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="p-1 rounded-lg transition-colors {% if note.is_pinned %}text-amber-500 hover:text-amber-600 bg-amber-50{% else %}text-slate-300 hover:text-amber-500 opacity-0 group-hover:opacity-100{% endif %}" title="{% if note.is_pinned %}Unpin{% else %}Pin to top{% endif %}">
                                <i data-lucide="pin" class="w-3.5 h-3.5 fill-current"></i>
                            </button>
                        </form>
