<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Habbit Tracker{% endblock %}</title>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Play CDN for rapid development & high responsiveness) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        surface: '#FFFFFF',
                        canvas: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/main.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full font-sans text-slate-900 antialiased bg-slate-50 flex overflow-hidden">

    {% if user.is_authenticated %}
    <!-- Left Navigation Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-30 transition-all duration-200" id="sidebar">
        <!-- Brand Logo & Header -->
        <div class="h-16 px-6 flex items-center justify-between border-b border-slate-100">
            <a href="{% url 'dashboard' %}" class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-200">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg text-slate-900 tracking-tight">Habbit<span class="text-blue-600">Tracker</span></span>
            </a>
        </div>

        <!-- Sidebar Navigation Menu -->
        <nav class="flex-1 px-4 py-5 space-y-1 overflow-y-auto">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-3 mb-2">Main</div>
            
            <a href="{% url 'dashboard' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if request.resolver_match.url_name == 'dashboard' %}bg-blue-50 text-blue-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="layout-dashboard" class="w-4 h-4 mr-3 {% if request.resolver_match.url_name == 'dashboard' %}text-blue-600{% else %}text-slate-400{% endif %}"></i>
                Dashboard
            </a>

            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-3 pt-4 mb-2">Productivity</div>

            <a href="{% url 'my_day' %}" class="flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg {% if request.resolver_match.url_name == 'my_day' %}bg-blue-50 text-blue-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <div class="flex items-center">
                    <i data-lucide="sun" class="w-4 h-4 mr-3 {% if request.resolver_match.url_name == 'my_day' %}text-blue-600{% else %}text-slate-400{% endif %}"></i>
                    My Day
                </div>
            </a>

            <a href="{% url 'all_tasks' %}" class="flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg {% if request.resolver_match.url_name == 'all_tasks' or request.resolver_match.url_name == 'task_create' or request.resolver_match.url_name == 'task_edit' or request.resolver_match.url_name == 'trash' %}bg-blue-50 text-blue-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <div class="flex items-center">
                    <i data-lucide="check-square" class="w-4 h-4 mr-3 {% if request.resolver_match.url_name == 'all_tasks' %}text-blue-600{% else %}text-slate-400{% endif %}"></i>
                    All Tasks
                </div>
            </a>

            <a href="{% url 'assignment_list' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if 'assignments' in request.path %}bg-indigo-50 text-indigo-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="graduation-cap" class="w-4 h-4 mr-3 {% if 'assignments' in request.path %}text-indigo-600{% else %}text-slate-400{% endif %}"></i>
                Assignments
            </a>

            <a href="{% url 'habit_list' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if 'habits' in request.path %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="flame" class="w-4 h-4 mr-3 {% if 'habits' in request.path %}text-emerald-600{% else %}text-slate-400{% endif %}"></i>
                Habit Tracker
            </a>

            <a href="{% url 'calendar' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if 'calendar' in request.path %}bg-blue-50 text-blue-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="calendar" class="w-4 h-4 mr-3 {% if 'calendar' in request.path %}text-blue-600{% else %}text-slate-400{% endif %}"></i>
                Calendar
            </a>

            <a href="{% url 'note_list' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if 'notes' in request.path %}bg-amber-50 text-amber-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="sticky-note" class="w-4 h-4 mr-3 {% if 'notes' in request.path %}text-amber-600{% else %}text-slate-400{% endif %}"></i>
                Quick Notes
            </a>

            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-3 pt-4 mb-2">Intelligence</div>

            <a href="{% url 'analytics_dashboard' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if 'analytics' in request.path %}bg-blue-50 text-blue-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="bar-chart-3" class="w-4 h-4 mr-3 {% if 'analytics' in request.path %}text-blue-600{% else %}text-slate-400{% endif %}"></i>
                Analytics
            </a>

            <a href="{% url 'smart_assistant' %}" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg {% if 'assistant' in request.path or 'review' in request.path %}bg-blue-50 text-blue-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %} transition-colors">
                <i data-lucide="sparkles" class="w-4 h-4 mr-3 {% if 'assistant' in request.path or 'review' in request.path %}text-blue-600{% else %}text-slate-400{% endif %}"></i>
                Smart Assistant
            </a>
        </nav>

        <!-- Sidebar Footer / User Profile -->
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center justify-between">
