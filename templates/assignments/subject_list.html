{% extends 'base.html' %}

{% block title %}Manage Subjects — My Habbit Tracker{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">College Subjects</h1>
            <p class="text-sm text-slate-500 mt-1">Configure courses and academic subjects</p>
        </div>
        <a href="{% url 'assignment_list' %}" class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1.5"></i>
            Back to Assignments
        </a>
    </div>

    <!-- Create Subject Card -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-700 mb-4">Add New Subject</h2>
        <form method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            {% csrf_token %}
            <div>{{ form.name }}</div>
            <div>{{ form.code }}</div>
            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm transition-colors">
                Add Subject
            </button>
        </form>
    </div>

    <!-- Subjects List -->
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="px-6 py-4 border-b border-slate-100 font-semibold text-sm text-slate-900">
            Active Subjects ({{ subjects.count }})
        </div>
